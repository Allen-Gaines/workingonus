<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="t d">
  <title id="t">Care conversation illustration</title>
  <desc id="d">An original illustration of a provider and a patient talking in two chairs, with speech bubbles and a plant, in Working On Us brand colors.</desc>
  <rect width="600" height="440" rx="28" fill="#EEF3FB"/>
  <!-- Window -->
  <rect x="390" y="50" width="150" height="120" rx="14" fill="#fff" stroke="#003BA5" stroke-opacity="0.15" stroke-width="4"/>
  <circle cx="490" cy="95" r="22" fill="#FEBD13"/>
  <path d="M398 160 q 40 -40 70 -10 q 30 -30 64 10 z" fill="#78AF31" opacity="0.6"/>
  <!-- Speech bubbles -->
  <rect x="90" y="60" width="160" height="70" rx="20" fill="#fff"/>
  <path d="M150 128 l 10 22 l 14 -22 z" fill="#fff"/>
  <rect x="112" y="82" width="110" height="10" rx="5" fill="#003BA5" opacity="0.35"/>
  <rect x="112" y="102" width="74" height="10" rx="5" fill="#003BA5" opacity="0.2"/>
  <rect x="300" y="110" width="130" height="58" rx="20" fill="#003BA5"/>
  <path d="M380 166 l 6 20 l 14 -20 z" fill="#003BA5"/>
  <rect x="320" y="130" width="86" height="9" rx="4.5" fill="#FEBD13"/>
  <rect x="320" y="146" width="56" height="9" rx="4.5" fill="#fff" opacity="0.6"/>
  <!-- Rug -->
  <ellipse cx="300" cy="380" rx="230" ry="26" fill="#78AF31" opacity="0.25"/>
  <!-- Chair + person left -->
  <rect x="110" y="300" width="130" height="22" rx="10" fill="#4C270A" opacity="0.8"/>
  <rect x="118" y="322" width="10" height="52" rx="4" fill="#4C270A" opacity="0.8"/>
  <rect x="222" y="322" width="10" height="52" rx="4" fill="#4C270A" opacity="0.8"/>
  <circle cx="175" cy="196" r="28" fill="#4C270A"/>
  <path d="M135 304 v-62 a40 40 0 0 1 80 0 v62 z" fill="#4E7A1F"/>
  <path d="M200 300 h 50 v 40 h -14 v -26 h -36 z" fill="#4E7A1F"/>
  <!-- Clipboard -->
  <rect x="200" y="250" width="34" height="44" rx="5" fill="#fff" stroke="#003BA5" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Chair + person right -->
  <rect x="360" y="300" width="130" height="22" rx="10" fill="#4C270A" opacity="0.8"/>
  <rect x="368" y="322" width="10" height="52" rx="4" fill="#4C270A" opacity="0.8"/>
  <rect x="472" y="322" width="10" height="52" rx="4" fill="#4C270A" opacity="0.8"/>
  <circle cx="425" cy="200" r="28" fill="#7A4A22"/>
  <path d="M385 304 v-60 a40 40 0 0 1 80 0 v60 z" fill="#003BA5"/>
  <path d="M400 300 h -50 v 40 h 14 v -26 h 36 z" fill="#003BA5"/>
  <!-- Plant -->
  <rect x="286" y="330" width="28" height="40" rx="6" fill="#FEBD13"/>
  <path d="M300 332 q -30 -40 -6 -76 q 20 30 6 76 z" fill="#78AF31"/>
  <path d="M300 334 q 28 -30 18 -64 q -26 22 -18 64 z" fill="#4E7A1F"/>
